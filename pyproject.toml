[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pts-wtu"
version = "0.1.0"
description = "Predictive Temporally Structured World Transition U (RoboCasa v0.1)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyarrow>=14",
  "pyyaml>=6",
  "tqdm>=4.66",
  "pillow>=10",
]

[project.optional-dependencies]
train = ["torch>=2.2", "transformers>=4.53"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pts_wtu*"]
